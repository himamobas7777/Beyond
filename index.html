<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1128">
<meta name="description" content="Beyond: discover opportunities, share what you build, and meet other Beyonders.">
<title>Beyond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one centered phone-width column; content scrolls; tab bar pinned at the bottom.
   Look: dark navy ground, cyan as the single accent; other hues only mark opportunity categories and post types. */
:root {
  color-scheme: dark;
  --bg: #0A1128; --surface: #121C3D; --surface2: #1A2650; --line: #33447A;
  --fg: #F1F5F9; --muted: #B4BED8; --accent: #22D3EE; --on-accent: #06122B;
  --good: #4ADE80; --warn: #FBBF24; --bad: #F87171; --heart: #FB7185;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font-body); padding-inline: 16px; }
#app { max-width: 640px; margin-inline: auto; min-height: 100vh; padding-block: 16px 104px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 8px; }
h2 { font-size: 1.15rem; font-weight: 800; margin: 26px 0 10px; }
h3 { font-size: 1.05rem; font-weight: 800; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); } .small { font-size: .875rem; }
.brand { font-family: var(--font-display); font-weight: 800; letter-spacing: .32em; color: var(--accent); font-size: .95rem; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1:focus, h2:focus { outline: none; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.filled { fill: currentColor; }
.err { color: var(--bad); min-height: 1.4em; margin-top: 8px; }

.btn { display: block; width: 100%; min-height: 48px; border-radius: 999px; border: 0; padding: 10px 24px; font-weight: 700; margin-top: 10px; text-align: center; text-decoration: none; background: var(--surface2); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.sec { background: var(--surface2); }
.btn.danger { background: transparent; color: var(--bad); border: 2px solid var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn:hover:not([disabled]) { filter: brightness(1.1); }
.small-btn { width: auto; min-width: 104px; margin: 0; min-height: 40px; padding: 6px 16px; flex: none; }
.icon-btn { width: 52px; flex: none; padding: 0; display: grid; place-items: center; }
.inline-ic { display: inline-flex; align-items: center; gap: 8px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.row.tight { margin-bottom: 4px; } .row.center { justify-content: center; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: .95rem; }
.chip[aria-pressed="true"] { background: var(--chip, var(--accent)); border-color: var(--chip, var(--accent)); color: var(--on-accent); }
.pill { border: 1px solid var(--pc, var(--line)); color: var(--pc, var(--muted)); border-radius: 999px; padding: 2px 10px; font-size: .75rem; font-weight: 700; white-space: nowrap; }

.card { display: block; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 10px; }
button.card:hover { background: var(--surface2); }
.opp { border-inline-start: 4px solid var(--cat, var(--accent)); }
.opp h3 { margin: 4px 0 4px; }
.quest { margin-top: 16px; } .quest-text { font-weight: 700; font-size: 1.1rem; margin-top: 4px; }
.label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

input[type="text"], textarea, select { width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); padding: 10px 14px; }
input::placeholder, textarea::placeholder { color: #9AA7C7; }
textarea { min-height: 110px; resize: vertical; }
.check { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 6px 0; width: 100%; background: none; border: 0; text-align: start; }
.box { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--muted); margin-top: 2px; display: grid; place-items: center; font-weight: 900; color: var(--on-accent); }
.check[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.linklike { color: var(--accent); text-decoration: underline; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.plain { background: none; border: 0; padding: 0; }

.header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; min-height: 48px; }
.back { min-height: 44px; min-width: 72px; background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 1.05rem; text-align: start; padding: 0; display: flex; align-items: center; }
.header .title, .handle { font-family: var(--font-display); font-weight: 800; flex: 1; text-align: center; font-size: 1.05rem; margin: 0; letter-spacing: 0; }
.header .spacer { min-width: 72px; }
.kv { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kv span:first-child { color: var(--muted); width: 112px; flex: none; } .kv span:last-child { min-width: 0; overflow-wrap: anywhere; }
.notice { border: 1px solid var(--warn); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
.empty { text-align: center; padding: 28px 8px; }
.welcome-hero { padding-top: 56px; } .welcome-hero h1 { font-size: 2.6rem; margin-top: 18px; }
.glow { position: fixed; inset: 0 0 auto 0; height: 340px; pointer-events: none; z-index: -1; background: radial-gradient(60% 100% at 50% 0%, rgba(34,211,238,.18), transparent 70%); }

.avatar { border-radius: 50%; overflow: hidden; display: grid; place-items: center; color: var(--on-accent); font-weight: 800; font-family: var(--font-display); flex: none; background: var(--surface2); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.seg, .feed-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.seg button, .feed-tabs button { flex: 1; min-height: 44px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 700; margin-bottom: -1px; }
.seg button[aria-selected="true"], .feed-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.fab { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }

.person { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.person-main { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: start; min-width: 0; flex: 1; min-height: 44px; }
.person-main span { min-width: 0; overflow-wrap: anywhere; }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.post-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.post-head .person-main { flex: 1; }
.post-body { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.post-body.as-btn { display: block; width: 100%; text-align: start; background: none; border: 0; padding: 0; }
.mini { display: flex; gap: 10px; width: 100%; text-align: start; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; min-height: 44px; }
.mini .bar { width: 4px; border-radius: 4px; flex: none; }
.post-actions { display: flex; gap: 6px; }
.act { display: flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 10px; background: none; border: 0; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.act.on { color: var(--accent); } .act[data-k^="like-"].on { color: var(--heart); }
.menu { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 4px; }
.comment { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cbody { overflow-wrap: anywhere; }
.cmt-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; } .cmt-row .btn { width: auto; margin: 0; }

.ptop { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin-bottom: 8px; }
.pname { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; overflow-wrap: anywhere; }
.stats { display: flex; gap: 8px; justify-content: center; width: 100%; }
.stat { flex: 1; max-width: 120px; display: flex; flex-direction: column; } .stat b { font-size: 1.2rem; font-variant-numeric: tabular-nums; } .stat span { color: var(--muted); font-size: .85rem; }
.pbtns { display: flex; gap: 8px; width: 100%; max-width: 420px; } .pbtns .btn { margin: 0; flex: 1; }
.pbio { max-width: 460px; margin: 4px 0 0; overflow-wrap: anywhere; }
.pquest { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; max-width: 460px; width: 100%; }
.ptabs { display: flex; border-bottom: 1px solid var(--line); margin-top: 8px; }
.ptabs button { flex: 1; min-height: 48px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); display: grid; place-items: center; margin-bottom: -1px; }
.ptabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 3px; } .grid > .empty { grid-column: 1 / -1; }
.tile { aspect-ratio: 3 / 4; min-width: 0; background: var(--surface); border: 0; border-top: 3px solid var(--tc); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 4px; text-align: start; overflow: hidden; }
.ttype { font-size: .65rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--tc); }
.tbody { font-size: .8rem; line-height: 1.3; flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.tlikes { display: flex; align-items: center; gap: 4px; font-size: .75rem; color: var(--muted); font-weight: 700; }
.otile .tbody { font-weight: 700; font-size: .85rem; }
.ed-top { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 8px 0 12px; } .ed-top .btn { width: auto; margin: 0; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 5; }
nav.tabs .inner { display: flex; width: 100%; max-width: 640px; }
nav.tabs button { flex: 1; min-height: 52px; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .75rem; font-weight: 600; border-radius: 12px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 800; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-width: 420px; margin-inline: auto; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-weight: 700; z-index: 10; text-align: center; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .card, .act { transition: filter .15s, background .15s; } }
.lang-pick { margin-bottom: 14px; } .lang-pick select { width: auto; min-width: 160px; }

.brand-row { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.bell { position: relative; width: 44px; height: 44px; display: grid; place-items: center; color: var(--fg); cursor: pointer; }
.bell .badge { position: absolute; top: 4px; inset-inline-end: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: .72rem; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.bell .badge[hidden] { display: none; }
.notif { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 8px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); font: inherit; text-align: start; cursor: pointer; min-height: 56px; }
.notif.unread { background: var(--surface); }
.chat-title { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; font-family: var(--font-display); font-weight: 800; min-width: 0; } .chat-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-bg { position: fixed; inset: 0; background: rgba(5,10,25,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px 20px; width: 100%; max-width: 380px; max-height: 88vh; overflow: auto; }
.modal .btn { margin-top: 8px; } .modal .row .btn { flex: 1; margin-top: 0; }
.tour-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; margin: 0 auto; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 8px; } .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); } .dots span.on { background: var(--accent); width: 22px; border-radius: 4px; }
.newlist { margin: 0 0 8px; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; }
body.modal-open { overflow: hidden; }
body.in-chat nav.tabs { display: none; }
.bubbles { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 16px; }
.bubble { max-width: 82%; padding: 8px 12px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.4; }
.bubble.mine { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-end-end-radius: 6px; }
.bubble.theirs { align-self: flex-start; background: var(--surface2); border-end-start-radius: 6px; }
.bubble .bmeta { font-size: .72rem; opacity: .75; margin-top: 2px; }
.composer { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: flex-end; padding: 8px 0 12px; background: var(--bg); }
.composer textarea { min-height: 44px; max-height: 120px; resize: none; flex: 1; }
.composer .send-btn { width: 48px; min-width: 48px; height: 48px; padding: 0; margin: 0; display: grid; place-items: center; flex: none; }
.composer.note { justify-content: center; text-align: center; }
[dir="rtl"] .send-btn .ic { transform: scaleX(-1); }

.notif .ntext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.notif .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }


button.stat { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; text-align: center; padding: 4px 0; min-height: 44px; }
.comment.reply { margin-inline-start: 36px; }
.cactions { display: flex; gap: 16px; margin-top: 2px; }
.cact { background: none; border: 0; color: var(--muted); font-size: .85rem; padding: 6px 2px; min-height: 32px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.cact.on { color: var(--heart); }
.replying { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 12px; font-size: .9rem; }

.views { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: .85rem; margin-inline-start: auto; padding-inline: 6px; }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Main navigation" hidden></nav>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="screens.js"></script>
<script src="main.js"></script>
</body>
</html>
